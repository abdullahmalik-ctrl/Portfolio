            const [user, setUser] = useState(demoMode ? { uid: 'demo-user', role: 'guest' } : null);
            const [appUser, setAppUser] = useState(null);
            const [nav, setNav] = useState({ name: 'home', data: null }); 
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [scrollY, setScrollY] = useState(0);

            // Data State
            const [profile, setProfile] = useState(DEFAULT_PROFILE);
            const [skills, setSkills] = useState(DEFAULT_SKILLS);
            const [projects, setProjects] = useState(DEFAULT_PROJECTS);
            const [education, setEducation] = useState(DEFAULT_EDUCATION);
            const [testimonials, setTestimonials] = useState(DEFAULT_TESTIMONIALS);
            const [meetings, setMeetings] = useState(DEFAULT_MEETINGS);
            const [support, setSupport] = useState(DEFAULT_SUPPORT);
            const [services, setServices] = useState(DEFAULT_SERVICES);

            useEffect(() => {
                const handleScroll = () => setScrollY(window.scrollY);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Auth & Data Init
            useEffect(() => {
                if (demoMode) {
                    setLoading(false);
                    return;
                }

                let mounted = true;
                const initAuth = async () => {
                    try {
                        // Check for Immersive Auth Token First
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.warn("Auth failed, falling back to Demo Mode:", error);
                        demoMode = true; 
                        if (mounted) setLoading(false);
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (mounted) setUser(u);
                });

                return () => { mounted = false; unsubscribe(); };
            }, []);

            // Data Fetching
            useEffect(() => {
                if (!user || demoMode) {
                    setLoading(false);
                    return;
                }

                const dataCollection = collection(db, 'artifacts', appId, 'public', 'data', 'portfolio');
                const setupListener = (docName, setter, defaultData) => {
                    return onSnapshot(doc(dataCollection, docName), (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            setter(data.list || data); 
                        } else {
                            setDoc(doc(dataCollection, docName), defaultData.list ? defaultData : { list: defaultData });
                        }
                    }, (err) => console.log(`Fetch error ${docName}:`, err));
                };

                const unsubs = [
                    setupListener('profile', setProfile, DEFAULT_PROFILE),
                    setupListener('skills', setSkills, DEFAULT_SKILLS),
                    setupListener('projects', setProjects, DEFAULT_PROJECTS),
                    setupListener('education', setEducation, DEFAULT_EDUCATION),
                    setupListener('testimonials', setTestimonials, DEFAULT_TESTIMONIALS),
                    setupListener('meetings', setMeetings, DEFAULT_MEETINGS),
                    setupListener('support', setSupport, DEFAULT_SUPPORT),
                    setupListener('services', setServices, DEFAULT_SERVICES),
                ];

                setLoading(false);
                return () => unsubs.forEach(u => u());
            }, [user]);

            const showToast = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const navigate = (name, data = null) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setNav({ name, data });
                setMobileMenuOpen(false);
            };

            const handleLogin = (email, password) => {
                if (email === 'admin@demo.com' && password === 'password') {
                    setAppUser({ email, role: 'admin', name: 'Admin User' });
                    navigate('dashboard');
                    showToast('Welcome Admin');
                } else if (email && password) {
                    setAppUser({ email, role: 'user', name: 'Valued Client' });
                    navigate('dashboard');
                    showToast('Login successful!');
                } else {
                    showToast('Invalid credentials');
                }
            };

            const handleLogout = () => {
                setAppUser(null);
                navigate('home');
                showToast('Logged out');
            };

            const saveData = async (collectionName, data) => {
                if (demoMode) {
                    if (collectionName === 'profile') setProfile(data);
                    if (collectionName === 'skills') setSkills(data.list);
                    if (collectionName === 'projects') setProjects(data.list);
                    if (collectionName === 'education') setEducation(data.list);
                    if (collectionName === 'testimonials') setTestimonials(data.list);
                    if (collectionName === 'services') setServices(data.list);
                    if (collectionName === 'meetings') setMeetings(data.list);
                    if (collectionName === 'support') setSupport(data.list);
                    showToast(`Saved ${collectionName} (Demo Mode)`);
                    return;
                }

                if (!user) return;
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'portfolio', collectionName), data);
                    showToast(`${collectionName.charAt(0).toUpperCase() + collectionName.slice(1)} updated!`);
                } catch (e) { console.error(e); showToast("Error saving data"); }
            };

            if (loading) return (
                <div className="min-h-screen bg-[#030014] flex items-center justify-center text-white">
                    <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                </div>
            );

            const backgroundStyle = {
                filter: `hue-rotate(${scrollY * 0.1}deg)`,
                transform: `translateY(${scrollY * 0.2}px)`
            };

            return (
                <div className="min-h-screen bg-[#030014] font-sans text-slate-200 selection:bg-purple-500/30 selection:text-purple-200 relative overflow-x-hidden">
                    
                    {/* Background */}
                    <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-[#030014] via-[#1a0b2e] to-[#030014]"></div>
                        <div className="absolute inset-0 opacity-60 transition-all duration-75" style={backgroundStyle}>
                            <div className="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-purple-600 rounded-full mix-blend-screen filter blur-[80px] animate-blob-spin opacity-50" />
                            <div className="absolute top-[20%] right-[-10%] w-[40vw] h-[40vw] bg-cyan-500 rounded-full mix-blend-screen filter blur-[80px] animate-blob-spin opacity-50" style={{ animationDirection: 'reverse', animationDuration: '25s' }} />
                            <div className="absolute bottom-[-10%] left-[20%] w-[45vw] h-[45vw] bg-pink-600 rounded-full mix-blend-screen filter blur-[80px] animate-blob-spin opacity-40" style={{ animationDuration: '30s' }} />
                        </div>
                        <div className="absolute inset-0 opacity-20 mix-blend-overlay" style={{backgroundImage: "url('https://grainy-gradients.vercel.app/noise.svg')"}}></div>
                    </div>

                    {/* Navbar */}
                    <nav className="sticky top-4 z-40 mx-auto max-w-5xl px-4 transition-all duration-300">
                        <div className="glass-panel rounded-full px-6 py-3 flex justify-between items-center shadow-2xl shadow-black/20">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => navigate('home')}>
                                <div className="w-10 h-10 bg-gradient-to-tr from-purple-600 to-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-purple-500/30 group-hover:rotate-12 transition-all duration-500">
                                    <Terminal size={20} />
                                </div>
                                <span className="font-bold text-lg tracking-tight text-white">
                                    {profile.name}<span className="text-purple-400">.dev</span>
                                </span>
                            </div>

                            <div className="hidden md:flex items-center gap-1 bg-white/5 rounded-full p-1 border border-white/5">
                                <button onClick={() => navigate('home')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 ${nav.name === 'home' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>Portfolio</button>
                                <button onClick={() => navigate('all-skills')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 ${nav.name === 'all-skills' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>Skills</button>
                                <button onClick={() => navigate('all-projects')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 ${nav.name === 'all-projects' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>Projects</button>
                                <button onClick={() => { if (nav.name !== 'home') { setNav({ name: 'home', data: null }); setTimeout(() => document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' }), 100); } else { document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' }); } }} className="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 text-slate-400 hover:text-white hover:bg-white/5">Contact</button>
                            </div>

                            <div className="hidden md:flex items-center gap-4">
                                {appUser ? (
                                    <button onClick={() => navigate('dashboard')} className="px-5 py-2.5 text-sm font-semibold text-white bg-purple-600/80 hover:bg-purple-500 rounded-full transition shadow-lg shadow-purple-900/20">Dashboard</button>
                                ) : (
                                    <button onClick={() => navigate('login')} className="p-2 text-slate-400 hover:text-white transition"><User size={20} /></button>
                                )}
                            </div>

                            <div className="md:hidden">
                                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="p-2 text-white">
                                    {mobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                                </button>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className="md:hidden absolute top-20 left-4 right-4 glass-panel rounded-3xl p-6 animate-fade-in-up z-50">
                                <button onClick={() => navigate('home')} className="block w-full text-left font-bold text-white py-3 border-b border-white/10">Portfolio</button>
                                <button onClick={() => navigate('all-skills')} className="block w-full text-left font-bold text-white py-3 border-b border-white/10">Skills</button>
                                <button onClick={() => navigate('all-projects')} className="block w-full text-left font-bold text-white py-3 border-b border-white/10">Projects</button>
                                <button onClick={() => { if (nav.name !== 'home') setNav({ name: 'home', data: null }); setMobileMenuOpen(false); setTimeout(() => document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' }), 100); }} className="block w-full text-left font-bold text-white py-3 border-b border-white/10">Contact</button>
                                {appUser ? (
                                    <>
                                        <button onClick={() => navigate('dashboard')} className="block w-full text-left font-bold text-white py-3 border-b border-white/10">Dashboard</button>
                                        <button onClick={handleLogout} className="block w-full text-left font-bold text-red-400 py-3">Logout</button>
                                    </>
                                ) : (
                                    <button onClick={() => navigate('login')} className="block w-full text-left font-bold text-purple-400 py-3">Login</button>
                                )}
                            </div>
                        )}
                    </nav>

                    <main className="relative z-10 min-h-[calc(100vh-100px)]">
                        
                        
                        {nav.name === 'home' && <HomeView profile={profile} skills={skills} projects={projects} education={education} testimonials={testimonials} navigate={navigate} />}
                        {nav.name === 'project' && nav.data && <ProjectDetailView project={nav.data} navigate={navigate} />}
                        {nav.name === 'skill' && nav.data && <SkillDetailView skillGroup={nav.data} navigate={navigate} />}
                        {nav.name === 'all-projects' && <AllProjectsView projects={projects} navigate={navigate} />}
                        {nav.name === 'all-skills' && <AllSkillsView skills={skills} navigate={navigate} />}
                        {nav.name === 'login' && <LoginView onLogin={handleLogin} />}
                        {nav.name === 'dashboard' && appUser && <Dashboard user={appUser} profile={profile} skills={skills} projects={projects} education={education} testimonials={testimonials} meetings={meetings} support={support} services={services} saveData={saveData} onLogout={handleLogout} />}
                    </main>

                    <footer className="border-t border-white/10 py-12 relative z-10 mt-20 bg-black/20 backdrop-blur-lg">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col items-center">
                            <p className="text-slate-500 text-sm font-medium">© {new Date().getFullYear()} {profile.name}. All rights reserved.</p>
                        </div>
                    </footer>

                    {notification && <Toast message={notification} />}
                </div>
            );
        }

        // --- Sub-Components (Views) ---
        function HomeView({ profile, skills, projects, education, testimonials, navigate }) {
            const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=${profile.email}`;
            const skillsRef = useRef(null);
            const projectsRef = useRef(null);
            const testimonialsRef = useRef(null);
            const [showSkillLeft, setShowSkillLeft] = useState(false);
            const [showSkillRight, setShowSkillRight] = useState(true);
            const [showProjLeft, setShowProjLeft] = useState(false);
            const [showProjRight, setShowProjRight] = useState(true);
            const [showTestiLeft, setShowTestiLeft] = useState(false);
            const [showTestiRight, setShowTestiRight] = useState(true);

            const handleScroll = (ref, setLeft, setRight) => {
                if (ref.current) {
                const { scrollLeft, scrollWidth, clientWidth } = ref.current;
                setLeft(scrollLeft > 20);
                setRight(scrollLeft < scrollWidth - clientWidth - 20);
                }
            };

            useEffect(() => {
                const sRef = skillsRef.current;
                const pRef = projectsRef.current;
                const tRef = testimonialsRef.current;
                const checkSkills = () => handleScroll(skillsRef, setShowSkillLeft, setShowSkillRight);
                const checkProjs = () => handleScroll(projectsRef, setShowProjLeft, setShowProjRight);
                const checkTestis = () => handleScroll(testimonialsRef, setShowTestiLeft, setShowTestiRight);
                if (sRef) { sRef.addEventListener('scroll', checkSkills); checkSkills(); }
                if (pRef) { pRef.addEventListener('scroll', checkProjs); checkProjs(); }
                if (tRef) { tRef.addEventListener('scroll', checkTestis); checkTestis(); }
                return () => {
                    if (sRef) sRef.removeEventListener('scroll', checkSkills);
                    if (pRef) pRef.removeEventListener('scroll', checkProjs);
                    if (tRef) tRef.removeEventListener('scroll', checkTestis);
                };
            }, [skills, projects, testimonials]); 

            const scroll = (ref, direction) => {
                if (ref.current) {
                const scrollAmount = direction === 'left' ? -350 : 350;
                ref.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };
            
            const cardWidthClass = "w-[85vw] md:w-[45vw] lg:w-[350px]";
            const projectCardHeightClass = "h-[420px]";
            const skillCardHeightClass = "h-[340px]";

            return (
                <div className="pb-12 space-y-24 md:space-y-32 px-4">
                    <section className="relative pt-20 max-w-6xl mx-auto">
                        <div className="grid lg:grid-cols-12 gap-12 items-center">
                        <div className="lg:col-span-7 space-y-8 animate-fade-in-up relative z-10 text-center lg:text-left">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-purple-500/10 backdrop-blur-md rounded-full border border-purple-500/20 text-purple-300 text-xs font-bold tracking-wide uppercase shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                                <div className="w-2 h-2 rounded-full bg-green-400 animate-pulse" />
                                Available for Work
                            </div>
                            <h1 className="text-5xl md:text-7xl font-extrabold text-white leading-[1.1] tracking-tight">
                            Building the <br />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-orange-400 animate-gradient-x">Future of Web</span>
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed max-w-xl mx-auto lg:mx-0">{profile.bio}</p>
                            <div className="flex flex-wrap gap-4 justify-center lg:justify-start">
                            <a href={gmailLink} target="_blank" rel="noreferrer" className="px-8 py-4 glass-panel text-white font-bold rounded-full hover:bg-white/10 hover:scale-105 transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.1)]">Let's Talk</a>
                            </div>
                        </div>
                        <div className="lg:col-span-5 relative hidden lg:block h-[600px]">
                            <div className="absolute top-10 right-10 w-64 h-80 glass-panel rounded-3xl p-6 transform rotate-6 z-10 animate-float" style={{ animationDelay: '0s' }}>
                                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-500 to-orange-400 flex items-center justify-center mb-4"><Code className="text-white" /></div>
                                <div className="h-2 w-24 bg-white/20 rounded mb-2"></div><div className="h-2 w-32 bg-white/10 rounded mb-6"></div>
                                <div className="space-y-3">{[1,2,3].map(i => <div key={i} className="h-16 w-full bg-white/5 rounded-xl border border-white/5"></div>)}</div>
                            </div>
                            
                            <div className="absolute top-32 left-0 w-72 h-96 glass-panel bg-black/40 rounded-3xl p-6 transform -rotate-3 z-20 animate-float border-white/20 shadow-2xl" style={{ animationDelay: '1.5s' }}>
                                <div className="flex justify-between items-center mb-8">
                                <div className="text-sm font-bold text-slate-400">Performance</div>
                                <div className="text-green-400 text-xs font-bold bg-green-400/20 px-2 py-1 rounded">+24%</div>
                                </div>
                                <div className="flex gap-2 items-end h-48 mb-6 px-2">
                                {[40, 65, 45, 80, 55, 90, 70].map((h, i) => (
                                    <div key={i} className="flex-1 bg-gradient-to-t from-purple-600 to-blue-500 rounded-t-lg opacity-80 hover:opacity-100 transition-all" style={{ height: `${h}%` }}></div>
                                ))}
                                </div>
                                <div className="flex items-center gap-3 p-3 bg-white/5 rounded-xl">
                                <div className="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400"><Database size={14}/></div>
                                <div className="text-xs text-slate-300">Database Optimized</div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </section>
                    
                    {/* Skills */}
                    <section id="skills" className="max-w-7xl mx-auto px-4 relative">
                        <div className="mb-8 flex justify-between items-end">
                        <h2 className="text-3xl md:text-4xl font-bold text-white">Tech Stack</h2>
                        <button onClick={() => navigate('all-skills')} className="text-purple-400 hover:text-purple-300 font-bold text-sm flex items-center gap-2 transition-colors">Explore All <ChevronRight size={16} /></button>
                        </div>
                        <div className="relative group">
                            {showSkillLeft && <button onClick={() => scroll(skillsRef, 'left')} className="absolute left-0 top-1/2 -translate-y-1/2 -ml-4 z-20 p-3 rounded-full bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-xl hover:bg-purple-600 transition-all active:scale-95 hidden md:flex"><ChevronLeft size={24} /></button>}
                            <div ref={skillsRef} className="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-8 pt-10 no-scrollbar -mx-4 px-4 md:mx-0 md:px-0">
                            {skills.map((skillGroup, idx) => (
                                <HangingCard key={idx} delay={idx * 0.2}>
                                <div onClick={() => navigate('skill', skillGroup)} className={`glass-panel glass-card-hover p-8 rounded-[2rem] cursor-pointer transition-all duration-300 group/card ${cardWidthClass} ${skillCardHeightClass} snap-center shrink-0 flex flex-col`}>
                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-6 transition-colors duration-300 ${skillGroup.category === 'Web' ? 'bg-blue-500/20 text-blue-400 group-hover:bg-blue-500 group-hover:text-white' : skillGroup.category === 'App' ? 'bg-pink-500/20 text-pink-400 group-hover:bg-pink-500 group-hover:text-white' : 'bg-purple-500/20 text-purple-400 group-hover:bg-purple-500 group-hover:text-white'}`}>
                                    {skillGroup.category === 'Web' ? <Layout size={28} /> : skillGroup.category === 'App' ? <Smartphone size={28} /> : <Database size={28} />}
                                </div>
                                <h3 className="text-2xl font-bold text-white mb-2">{skillGroup.category}</h3>
                                <p className="text-sm text-slate-400 mb-6 line-clamp-3">{skillGroup.desc}</p>
                                <div className="flex flex-wrap gap-2 mt-auto">
                                    {skillGroup.items.slice(0, 4).map((skill, sIdx) => <span key={sIdx} className="px-3 py-1 bg-white/5 border border-white/10 text-slate-300 text-xs font-semibold rounded-lg">{skill}</span>)}
                                    {skillGroup.items.length > 4 && <span className="px-3 py-1 text-slate-500 text-xs font-semibold">+{skillGroup.items.length - 4}</span>}
                                </div>
                                </div>
                                </HangingCard>
                            ))}
                            </div>
                            {showSkillRight && <button onClick={() => scroll(skillsRef, 'right')} className="absolute right-0 top-1/2 -translate-y-1/2 -mr-4 z-20 p-3 rounded-full bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-xl hover:bg-purple-600 transition-all active:scale-95 hidden md:flex"><ChevronRight size={24} /></button>}
                        </div>
                    </section>
                    
                    {/* Projects */}
                    <section id="projects" className="max-w-7xl mx-auto px-4 relative">
                        <div className="flex justify-between items-end mb-12">
                            <h2 className="text-3xl md:text-4xl font-bold text-white">Selected Works</h2>
                            <button onClick={() => navigate('all-projects')} className="text-purple-400 hover:text-purple-300 font-bold text-sm flex items-center gap-2 transition-colors">Explore All <ChevronRight size={16} /></button>
                        </div>
                        <div className="relative group">
                            {showProjLeft && <button onClick={() => scroll(projectsRef, 'left')} className="absolute left-0 top-1/2 -translate-y-1/2 -ml-4 z-20 p-3 rounded-full bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-xl hover:bg-purple-600 transition-all active:scale-95 hidden md:flex"><ChevronLeft size={24} /></button>}
                            <div ref={projectsRef} className="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-8 pt-10 no-scrollbar -mx-4 px-4 md:mx-0 md:px-0">
                            {projects.map((project, idx) => (
                                <HangingCard key={project.id} delay={idx * 0.2 + 0.5}>
                                <div onClick={() => navigate('project', project)} className={`group/card glass-panel rounded-[2rem] overflow-hidden cursor-pointer transition-all duration-500 hover:-translate-y-2 ${cardWidthClass} ${projectCardHeightClass} snap-center shrink-0 flex flex-col`}>
                                <div className="relative h-48 overflow-hidden shrink-0"><img src={project.image} alt={project.title} className="w-full h-full object-cover transform group-hover/card:scale-105 transition-transform duration-500" /></div>
                                <div className="p-6 flex flex-col flex-grow">
                                    <div className="flex flex-wrap gap-2 mb-3">{project.tags.slice(0, 2).map((tag, tIdx) => <span key={tIdx} className="text-[10px] uppercase tracking-wider font-bold text-purple-300 bg-purple-500/10 px-2 py-1 rounded-md">{tag}</span>)}</div>
                                    <h3 className="text-xl font-bold text-white mb-2">{project.title}</h3>
                                    <p className="text-slate-400 text-sm line-clamp-3 mb-4">{project.desc}</p>
                                    <div className="mt-auto text-xs font-bold text-slate-500 group-hover:text-purple-400 transition-colors flex items-center gap-1">Learn More <ChevronRight size={14} /></div>
                                </div>
                                </div>
                                </HangingCard>
                            ))}
                            </div>
                            {showProjRight && <button onClick={() => scroll(projectsRef, 'right')} className="absolute right-0 top-1/2 -translate-y-1/2 -mr-4 z-20 p-3 rounded-full bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-xl hover:bg-purple-600 transition-all active:scale-95 hidden md:flex"><ChevronRight size={24} /></button>}
                        </div>
                    </section>

                    {/* Education */}
                    <section id="education" className="max-w-4xl mx-auto px-4">
                        <div className="text-center mb-16"><h2 className="text-3xl font-bold text-white">Education Journey</h2></div>
                        <div className="space-y-6 relative">
                        <div className="absolute left-8 top-0 bottom-0 w-px bg-gradient-to-b from-purple-500 via-blue-500 to-transparent md:left-1/2"></div>
                        {education.map((edu, idx) => (
                            <div key={edu.id} className={`relative flex flex-col md:flex-row gap-8 md:gap-0 items-start md:items-center md:justify-between ${idx % 2 === 0 ? 'md:flex-row' : 'md:flex-row-reverse'}`}>
                            <div className="hidden md:block w-5/12"></div>
                            <div className="absolute left-8 md:left-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-black border-2 border-purple-500 shadow-[0_0_10px_#a855f7] z-10 mt-6 md:mt-0"></div>
                            <div className="ml-20 md:ml-0 w-[calc(100%-5rem)] md:w-5/12 glass-panel p-6 rounded-2xl hover:bg-white/5 transition-colors">
                                <span className="inline-block text-xs font-bold text-purple-300 mb-1">{edu.year}</span>
                                <h3 className="text-lg font-bold text-white">{edu.degree}</h3>
                                <p className="text-slate-400 text-sm">{edu.school}</p>
                            </div>
                            </div>
                        ))}
                        </div>
                    </section>

                    {/* Testimonials */}
                    <section id="testimonials" className="max-w-7xl mx-auto px-4 relative">
                        <div className="flex justify-between items-end mb-12"><div><h2 className="text-3xl md:text-4xl font-bold text-white">Client Stories</h2><p className="text-slate-400 mt-2">Feedback from people I've worked with.</p></div></div>
                        <div className="relative group">
                            {showTestiLeft && <button onClick={() => scroll(testimonialsRef, 'left')} className="absolute left-0 top-1/2 -translate-y-1/2 -ml-4 z-20 p-3 rounded-full bg-black/50 backdrop-blur-md border border-white/20 text-white shadow-xl hover:bg-purple-600 transition-all active:scale-95 hidden md:flex"><ChevronLeft size={24} /></button>}
                            <div ref={testimonialsRef} className="flex overflow-x-auto snap-x snap-mandatory gap-6 pb-8 pt-10 no-scrollbar -mx-4 px-4 md:mx-0 md:px-0">
                            {testimonials.map((testi, idx) => (
                                <HangingCard key={testi.id} delay={idx * 0.2 + 1}>
                                <div className={`glass-panel p-8 rounded-[2rem] flex flex-col ${cardWidthClass} min-h-[300px] snap-center shrink-0`}>
                                    <div className="flex items-center gap-4 mb-6">
                                        <div className="w-16 h-16 rounded-full overflow-hidden border-2 border-purple-500/30"><img src={testi.avatar} alt={testi.clientName} className="w-full h-full object-cover" /></div>
                                        <div><h4 className="font-bold text-white text-lg">{testi.clientName}</h4><p className="text-purple-400 text-sm font-medium">{testi.company}</p></div>
                                    </div>

        function Dashboard({ user, profile, skills, projects, education, testimonials, meetings, support, services, saveData, onLogout }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedServices, setSelectedServices] = useState([]);
            const [editProfile, setEditProfile] = useState(profile);
            const [editProjects, setEditProjects] = useState(projects);
            const [editEdu, setEditEdu] = useState(education);
            const [editTestimonials, setEditTestimonials] = useState(testimonials);
            const [editServices, setEditServices] = useState(services);
            const [meetingForm, setMeetingForm] = useState({ date: '', time: '', topic: '' });
            const [ticketForm, setTicketForm] = useState({ subject: '', priority: 'Medium', message: '' });
            const isAdmin = user.role === 'admin';
            const handleProfileChange = (e) => setEditProfile({ ...editProfile, [e.target.name]: e.target.value });
            const handleProjectChange = (id, field, value) => setEditProjects(editProjects.map(p => p.id === id ? { ...p, [field]: value } : p));
            const addProject = () => setEditProjects([...editProjects, { id: Date.now(), title: "New Project", desc: "Description...", challenge: "Challenge...", solution: "Solution...", tags: ["New"], image: "https://via.placeholder.com/600" }]);
            const handleEduChange = (id, field, value) => setEditEdu(editEdu.map(e => e.id === id ? { ...e, [field]: value } : e));
            const addEdu = () => setEditEdu([...editEdu, { id: Date.now(), degree: "Degree", school: "School", year: "Year", desc: "Description" }]);
            const handleTestimonialChange = (id, field, value) => setEditTestimonials(editTestimonials.map(t => t.id === id ? { ...t, [field]: value } : t));
            const addTestimonial = () => setEditTestimonials([...editTestimonials, { id: Date.now(), clientName: "Client Name", company: "Company", avatar: "https://i.pravatar.cc/150", quote: "Great work!", rating: 5 }]);
            const handleServiceChange = (id, field, value) => setEditServices(editServices.map(s => s.id === id ? { ...s, [field]: value } : s));
            const addService = () => setEditServices([...editServices, { id: `svc-${Date.now()}`, name: "New Service", price: 100, description: "Service description...", features: ["Feature 1", "Feature 2"], icon: "Box" }]);
            const toggleService = (serviceId) => selectedServices.includes(serviceId) ? setSelectedServices(selectedServices.filter(id => id !== serviceId)) : setSelectedServices([...selectedServices, serviceId]);
            const calculateTotal = () => selectedServices.reduce((acc, id) => { const service = services.find(s => s.id === id); return acc + (service ? service.price : 0); }, 0);
            const requestMeeting = () => { if(!meetingForm.date || !meetingForm.time) return; saveData('meetings', { list: [...meetings, { id: Date.now(), client: user.name, date: meetingForm.date, time: meetingForm.time, topic: meetingForm.topic, status: 'Pending' }] }); setMeetingForm({ date: '', time: '', topic: '' }); };
            const confirmMeeting = (id) => saveData('meetings', { list: meetings.map(m => m.id === id ? { ...m, status: 'Confirmed' } : m) });
            const createTicket = () => { if(!ticketForm.subject) return; saveData('support', { list: [...support, { id: Date.now(), client: user.name, subject: ticketForm.subject, priority: ticketForm.priority, status: 'Open', date: new Date().toISOString().split('T')[0] }] }); setTicketForm({ subject: '', priority: 'Medium', message: '' }); };
            const updateTicketStatus = (id, newStatus) => saveData('support', { list: support.map(t => t.id === id ? { ...t, status: newStatus } : t) });

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

                            <><button onClick={() => setActiveTab('overview')} className={`w-full flex items-center gap-3 px-6 py-4 rounded-2xl text-sm font-bold transition-all ${activeTab === 'overview' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}><ShoppingCart size={20} /><span className="capitalize">Services & Pricing</span></button><button onClick={() => setActiveTab('meetings')} className={`w-full flex items-center gap-3 px-6 py-4 rounded-2xl text-sm font-bold transition-all ${activeTab === 'meetings' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}><Clock size={20} /><span className="capitalize">My Meetings</span></button><button onClick={() => setActiveTab('support')} className={`w-full flex items-center gap-3 px-6 py-4 rounded-2xl text-sm font-bold transition-all ${activeTab === 'support' ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}><AlertCircle size={20} /><span className="capitalize">Support Tickets</span></button></>
                        )}

                    {!isAdmin && activeTab === 'overview' && <div className="p-6 bg-white/5 border-t border-white/10 backdrop-blur-sm animate-fade-in-up"><div className="mb-4"><p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Estimated Cost</p><div className="flex items-baseline gap-1"><span className="text-3xl font-extrabold text-white">${calculateTotal()}</span><span className="text-xs text-slate-500 font-medium">USD</span></div></div><button className="w-full glass-panel text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-white/10 hover:scale-105 transition-all shadow-lg">Request Quote <ArrowRight size={16} /></button></div>}
                    <div className="p-4 border-t border-white/10 bg-black/20"><button onClick={onLogout} className="w-full flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-bold transition-all text-red-400 hover:bg-red-500/10"><LogOut size={18} /><span>Logout</span></button></div>

bel>)})}</div></div>}
                    {activeTab === 'meetings' && <div className="space-y-8"><div className="glass-panel p-8 rounded-3xl flex justify-between items-center"><div><h2 className="text-2xl font-bold text-white">Meeting Scheduler</h2><p className="text-slate-400 text-sm mt-1">Book a time to discuss your project.</p></div><Clock size={32} className="text-purple-400" /></div>{!isAdmin && <div className="glass-panel p-8 rounded-3xl"><h3 className="font-bold text-white mb-4">Book New Session</h3><div className="grid md:grid-cols-3 gap-4 mb-4"><input type="date" value={meetingForm.date} onChange={e => setMeetingForm({...meetingForm, date: e.target.value})} className="px-4 py-3 rounded-xl bg-black/20 border border-white/10 text-white" /><input type="time" value={meetingForm.time} onChange={e => setMeetingForm({...meetingForm, time: e.target.value})} className="px-4 py-3 rounded-xl bg-black/20 border border-white/10 text-white" /><input type="text" placeholder="Topic" value={meetingForm.topic} onChange={e => setMeetingForm({...meetingForm, topic: e.target.value})} className="px-4 py-3 rounded-xl bg-black/20 border border-white/10 text-white" /></div><button onClick={requestMeeting} className="w-full glass-panel text-white py-3 rounded-xl font-bold hover:bg-white/10 transition">Request Meeting</button></div>}<div className="glass-panel p-8 rounded-3xl"><h3 className="font-bold text-white mb-6">{isAdmin ? "All Meetings" : "Your Upcoming Meetings"}</h3><div className="space-y-4">{meetings.filter(m => isAdmin || m.client === user.name).map(m => (<div key={m.id} className="flex items-center justify-between p-4 bg-white/5 rounded-xl border border-white/5"><div className="flex items-center gap-4"><div className="w-12 h-12 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400 font-bold">{m.date.split('-')[2]}</div><div><p className="font-bold text-white">{m.topic}</p><p className="text-xs text-slate-400">{m.date} at {m.time} • {isAdmin ? m.client : "You"}</p></div></div><div className="flex items-center gap-3"><span className={`text-xs font-bold px-3 py-1 rounded-full ${m.status === 'Confirmed' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}`}>{m.status}</span>{isAdmin && m.status === 'Pending' && <button onClick={() => confirmMeeting(m.id)} className="p-2 bg-white/10 rounded-lg hover:bg-green-500/20 text-green-400 transition"><CheckSquare size={16} /></button>}</div></div>))}{meetings.filter(m => isAdmin || m.client === user.name).length === 0 && <p className="text-slate-500 text-center py-4">No scheduled meetings.</p>}</div></div></div>}
                    {activeTab === 'support' && <div className="space-y-8"><div className="glass-panel p-8 rounded-3xl flex justify-between items-center"><div><h2 className="text-2xl font-bold text-white">Support Center</h2><p className="text-slate-400 text-sm mt-1">Track bugs and feature requests.</p></div><AlertCircle size={32} className="text-pink-400" /></div>{!isAdmin && <div className="glass-panel p-8 rounded-3xl"><h3 className="font-bold text-white mb-4">Open New Ticket</h3><div className="grid md:grid-cols-2 gap-4 mb-4"><input placeholder="Subject" value={ticketForm.subject} onChange={e => setTicketForm({...ticketForm, subject: e.target.value})} className="px-4 py-3 rounded-xl bg-black/20 border border-white/10 text-white" /><select value={ticketForm.priority} onChange={e => setTicketForm({...ticketForm, priority: e.target.value})} className="px-4 py-3 rounded-xl bg-black/20 border border-white/10 text-white"><option>Low</option><option>Medium</option><option>High</option></select></div><button onClick={createTicket} className="w-full glass-panel text-white py-3 rounded-xl font-bold hover:bg-white/10 transition">Submit Ticket</button></div>}<div className="glass-panel p-8 rounded-3xl"><div className="grid gap-4">{support.filter(t => isAdmin || t.client === user.name).map(t => (<div key={t.id} className="p-6 bg-white/5 rounded-2xl border border-white/5 flex flex-col md:flex-row justify-between gap-4"><div><div className="flex items-center gap-3 mb-2"><h4 className="font-bold text-white text-lg">{t.subject}</h4><span className={`text-[10px] uppercase font-bold px-2 py-1 rounded border ${t.priority === 'High' ? 'border-red-500/50 text-red-400 bg-red-500/10' : 'border-slate-500/50 text-slate-400 bg-slate-500/10'}`}>{t.priority}</span></div><p className="text-sm text-slate-400">Opened on {t.date} • {isAdmin ? t.client : "You"}</p></div><div className="flex items-center gap-4">{isAdmin ? <select value={t.status} onChange={(e) => updateTicketStatus(t.id, e.target.value)} className="bg-black/40 text-white text-sm px-3 py-2 rounded-lg border border-white/10 outline-none"><option>Open</option><option>In Progress</option><option>Resolved</option></select> : <span className={`text-sm font-bold px-3 py-1 rounded-full ${t.status === 'Resolved' ? 'bg-green-500/20 text-green-400' : 'bg-blue-500/20 text-blue-400'}`}>{t.status}</span>}</div></div>))}{support.filter(t => isAdmin || t.client === user.name).length === 0 && <p className="text-slate-500 text-center py-4">No support tickets found.</p>}</div></div></div>}
                    {activeTab === 'overview' && isAdmin && <div className="space-y-8"><div className="bg-gradient-to-r from-purple-600 to-blue-600 rounded-3xl p-8 text-white shadow-lg shadow-purple-900/20"><h2 className="text-3xl font-bold mb-2">Dashboard Overview</h2><p className="text-purple-100 opacity-80">Welcome back to your portfolio management system.</p></div><div className="grid grid-cols-1 md:grid-cols-3 gap-6"><div className="glass-panel p-8 rounded-3xl text-center"><p className="text-slate-400 font-bold text-xs uppercase tracking-wider">Meetings</p><p className="text-4xl font-extrabold text-white mt-2">{meetings.filter(m => m.status === 'Pending').length} <span className="text-sm font-medium text-slate-400">Pending</span></p></div><div className="glass-panel p-8 rounded-3xl text-center"><p className="text-slate-400 font-bold text-xs uppercase tracking-wider">Support</p><p className="text-4xl font-extrabold text-white mt-2">{support.filter(s => s.status === 'Open').length} <span className="text-sm font-medium text-slate-400">Open</span></p></div><div className="glass-panel p-8 rounded-3xl text-center"><p className="text-slate-400 font-bold text-xs uppercase tracking-wider">Services</p><p className="text-4xl font-extrabold text-white mt-2">{services.length}</p></div></div></div>}
                    {activeTab === 'edit-profile' && isAdmin && <div className="glass-panel rounded-3xl p-10"><h2 className="text-2xl font-bold text-white mb-8">Edit Profile</h2><div className="space-y-6"><input name="name" value={editProfile.name} onChange={handleProfileChange} className="w-full px-5 py-3 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Name" /><input name="title" value={editProfile.title} onChange={handleProfileChange} className="w-full px-5 py-3 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Title" /><textarea name="bio" value={editProfile.bio} onChange={handleProfileChange} rows={5} className="w-full px-5 py-3 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Bio" /><button onClick={() => saveData('profile', editProfile)} className="glass-panel text-white px-8 py-3 rounded-xl font-bold hover:bg-white/10 transition">Save Changes</button></div></div>}
                    {activeTab === 'edit-projects' && isAdmin && <div className="space-y-8"><div className="flex justify-between items-center glass-panel p-6 rounded-3xl"><h2 className="text-xl font-bold text-white ml-2">Projects</h2><button onClick={addProject} className="flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-purple-500 transition"><Plus size={18} /> Add New</button></div><div className="grid gap-8">{editProjects.map((p) => (<div key={p.id} className="glass-panel p-8 rounded-3xl"><div className="space-y-4"><input value={p.title} onChange={(e) => handleProjectChange(p.id, 'title', e.target.value)} className="w-full font-bold text-lg px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Title" /><textarea value={p.desc} onChange={(e) => handleProjectChange(p.id, 'desc', e.target.value)} rows={2} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Description" /><div className="grid grid-cols-2 gap-4"><textarea value={p.challenge} onChange={(e) => handleProjectChange(p.id, 'challenge', e.target.value)} rows={2} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Challenge" /><textarea value={p.solution} onChange={(e) => handleProjectChange(p.id, 'solution', e.target.value)} rows={2} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Solution" /></div><button onClick={() => setEditProjects(editProjects.filter(prj => prj.id !== p.id))} className="text-red-400 font-bold text-sm flex items-center gap-2"><Trash2 size={16} /> Remove</button></div></div>))}</div><button onClick={() => saveData('projects', { list: editProjects })} className="w-full glass-panel text-white py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition">Save All Projects</button></div>}
                    {activeTab === 'edit-edu' && isAdmin && <div className="space-y-8"><div className="flex justify-between items-center glass-panel p-6 rounded-3xl"><h2 className="text-xl font-bold text-white ml-2">Education</h2><button onClick={addEdu} className="flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-purple-500 transition"><Plus size={18} /> Add New</button></div><div className="grid gap-8">{editEdu.map((e) => (<div key={e.id} className="glass-panel p-8 rounded-3xl relative"><div className="grid md:grid-cols-2 gap-4 mb-4"><input value={e.degree} onChange={(ev) => handleEduChange(e.id, 'degree', ev.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Degree" /><input value={e.school} onChange={(ev) => handleEduChange(e.id, 'school', ev.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="School" /></div><textarea value={e.desc} onChange={(ev) => handleEduChange(e.id, 'desc', ev.target.value)} rows={2} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white mb-4" placeholder="Description" /><button onClick={() => setEditEdu(editEdu.filter(item => item.id !== e.id))} className="text-red-400 font-bold text-sm flex items-center gap-2"><Trash2 size={16} /> Remove</button></div>))}</div><button onClick={() => saveData('education', { list: editEdu })} className="w-full glass-panel text-white py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition">Save All Education</button></div>}
                    {activeTab === 'edit-services' && isAdmin && <div className="space-y-8"><div className="flex justify-between items-center glass-panel p-6 rounded-3xl"><h2 className="text-xl font-bold text-white ml-2">Manage Services</h2><button onClick={addService} className="flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-purple-500 transition"><Plus size={18} /> Add New</button></div><div className="grid gap-8">{editServices.map(s => { const IconComponent = getIconComponent(s.icon); return (<div key={s.id} className="glass-panel p-8 rounded-3xl"><div className="grid md:grid-cols-2 gap-4 mb-4"><input value={s.name} onChange={(e) => handleServiceChange(s.id, 'name', e.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Service Name" /><div className="relative"><span className="absolute left-4 top-2 text-slate-500">$</span><input type="number" value={s.price} onChange={(e) => handleServiceChange(s.id, 'price', parseInt(e.target.value))} className="w-full pl-8 pr-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Price" /></div></div><div className="grid md:grid-cols-3 gap-4 mb-4"><div className="md:col-span-2"><textarea value={s.description} onChange={(e) => handleServiceChange(s.id, 'description', e.target.value)} rows={2} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Description" /></div><div className="flex flex-col gap-2"><label className="text-xs text-slate-500 font-bold uppercase">Icon</label><select value={s.icon} onChange={(e) => handleServiceChange(s.id, 'icon', e.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/40 border border-white/10 text-white outline-none">{Object.keys(ICON_MAP).map(iconName => (<option key={iconName} value={iconName}>{iconName}</option>))}</select><div className="flex items-center gap-2 text-sm text-purple-300"><IconComponent size={16} /> <span>Preview</span></div></div></div><div className="mb-4"><label className="text-xs text-slate-500 font-bold uppercase block mb-2">Features (Comma separated)</label><input value={s.features.join(', ')} onChange={(e) => handleServiceChange(s.id, 'features', e.target.value.split(',').map(f => f.trim()))} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Feature 1, Feature 2, Feature 3" /></div><button onClick={() => setEditServices(editServices.filter(item => item.id !== s.id))} className="text-red-400 font-bold text-sm flex items-center gap-2"><Trash2 size={16} /> Remove</button></div>)})}</div><button onClick={() => saveData('services', { list: editServices })} className="w-full glass-panel text-white py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition">Save All Services</button></div>}
                    {activeTab === 'edit-testimonials' && isAdmin && <div className="space-y-8"><div className="flex justify-between items-center glass-panel p-6 rounded-3xl"><h2 className="text-xl font-bold text-white ml-2">Client Reviews</h2><button onClick={addTestimonial} className="flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-purple-500 transition"><Plus size={18} /> Add New</button></div><div className="grid gap-8">{editTestimonials.map(t => (<div key={t.id} className="glass-panel p-8 rounded-3xl"><div className="grid md:grid-cols-2 gap-4 mb-4"><input value={t.clientName} onChange={(e) => handleTestimonialChange(t.id, 'clientName', e.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Client Name" /><input value={t.company} onChange={(e) => handleTestimonialChange(t.id, 'company', e.target.value)} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Company" /></div><div className="grid md:grid-cols-4 gap-4 mb-4"><input value={t.avatar} onChange={(e) => handleTestimonialChange(t.id, 'avatar', e.target.value)} className="md:col-span-3 w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Avatar URL" /><input type="number" min="1" max="5" value={t.rating} onChange={(e) => handleTestimonialChange(t.id, 'rating', parseInt(e.target.value))} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white" placeholder="Rating (1-5)" /></div><textarea value={t.quote} onChange={(e) => handleTestimonialChange(t.id, 'quote', e.target.value)} rows={3} className="w-full px-4 py-2 rounded-xl bg-black/20 border border-white/10 text-white mb-4" placeholder="Review Quote" /><button onClick={() => setEditTestimonials(editTestimonials.filter(item => item.id !== t.id))} className="text-red-400 font-bold text-sm flex items-center gap-2"><Trash2 size={16} /> Remove</button></div>))}</div><button onClick={() => saveData('testimonials', { list: editTestimonials })} className="w-full glass-panel text-white py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition">Save All Reviews</button></div>}
                    </div>
                </div>
                </div>
            );
        }

        // Mount the app
        const root = createRoot(document.getElementById('root'));
        root.render(<PortfolioApp />);
    </script>
</body>
</html>
